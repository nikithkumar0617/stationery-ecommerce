<!DOCTYPE html>
<html>
<head>

<title>Track Order</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{

    margin:0;
    padding:40px;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
    color:#111633;

}

.container{

    max-width:900px;
    margin:auto;

}

.page-title{

    margin-bottom:40px;

}

.page-title h1{

    margin:0;
    font-size:58px;
    font-weight:800;

}

.title-line{

    width:90px;
    height:5px;
    background:#ff5a2c;
    margin-top:14px;
    border-radius:20px;

}

.card{

    background:white;
    border-radius:22px;
    padding:35px;
    box-shadow:0 12px 35px rgba(0,0,0,.08);

}

.order-number{

    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;

}

.status{

    display:inline-block;
    background:#f39c12;
    color:white;
    padding:8px 20px;
    border-radius:25px;
    font-weight:bold;
    margin:15px 0;

}

.timeline{

    margin-top:35px;

}

.step{

    padding:16px 22px;
    margin-bottom:18px;
    border-radius:12px;
    background:#edf1f7;
    color:#777;
    font-weight:bold;
    transition:.3s;

}

.step.active{

    background:#27ae60;
    color:white;

}

.back-btn{

    display:inline-block;
    margin-top:35px;
    text-decoration:none;
    background:#111633;
    color:white;
    padding:14px 26px;
    border-radius:10px;
    font-weight:bold;

}

.back-btn:hover{

    background:#1f2858;

}
</style>

</head>

<body>

<div class="container">

<div class="page-title">

<h1>Track Order</h1>

<div class="title-line"></div>

</div>

<div id="trackContainer">

Loading Order...

</div>

</div>

<script>

const supabaseClient =
supabase.createClient(
    "https://bojfqifnbwhavmcrxmkg.supabase.co",
    "sb_publishable_3AIqLVymxDF06OsewH_Byg_V_YZ0atI"
);

const params =
new URLSearchParams(
    window.location.search
);

const orderId =
params.get("id");

loadOrder();

async function loadOrder(){

    const { data: order } =
    await supabaseClient
    .from("orders")
    .select("*")
    .eq("id", orderId)
    .single();

    const status =
    order.status.toLowerCase();

    let pending = "";
    let confirmed = "";
    let shipped = "";
    let delivered = "";

    if(
        status === "pending"
    ){
        pending = "active";
    }

    if(
        status === "confirmed"
    ){
        pending = "active";
        confirmed = "active";
    }

    if(
        status === "shipped"
    ){
        pending = "active";
        confirmed = "active";
        shipped = "active";
    }

    if(
        status === "delivered"
    ){
        pending = "active";
        confirmed = "active";
        shipped = "active";
        delivered = "active";
    }

    document
    .getElementById(
        "trackContainer"
    )
    .innerHTML = `

<div class="card">

<div class="order-number">

${order.order_number}

</div>

<div>

Current Status

</div>

<div class="status">

${order.status}

</div>

<div class="timeline">

<div class="step ${pending}">
✅ Order Placed
</div>

<div class="step ${confirmed}">
📦 Confirmed
</div>

<div class="step ${shipped}">
🚚 Shipped
</div>

<div class="step ${delivered}">
🎉 Delivered
</div>

</div>

<a
href="my-orders.html"
class="back-btn"
>

← Back To My Orders

</a>

</div>

    `;

}

</script>

</body>
</html>
