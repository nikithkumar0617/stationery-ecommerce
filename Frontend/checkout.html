<!DOCTYPE html>
<html>
<head>
    <title>Checkout - LaLa's Mart</title>

    <style>

body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f7fb;

padding:40px;

}

.box{

max-width:1300px;

margin:auto;

}

.checkout-container{

display:grid;

grid-template-columns:2fr 1fr;

gap:35px;

}

.shipping-box,
.summary-box{

background:white;

padding:30px;

border-radius:18px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

}

h1{

font-size:42px;

margin-bottom:30px;

color:#111633;

}

h2{

margin-bottom:20px;

color:#111633;

}

input,
textarea{

width:100%;

padding:15px;

margin-bottom:18px;

border:2px solid #e7eaf4;

border-radius:10px;

box-sizing:border-box;

font-size:15px;

}

textarea{

height:120px;

resize:none;

}

button{

width:100%;

padding:16px;

background:#ff5a2c;

color:white;

border:none;

border-radius:12px;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#e74a20;

}

.order-item{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #eee;

}

.order-item:last-child{

border:none;

}

#orderTotal{

font-size:28px;

margin-top:20px;

color:#ff5a2c;

}

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<h1>Checkout</h1>

<div class="checkout-container">

    <div class="shipping-box">

        <h2>Shipping Details</h2>

        <input id="customerName" placeholder="Full Name">

        <input id="customerPhone" placeholder="Phone Number">

        <textarea
        id="customerAddress"
        placeholder="Delivery Address">
        </textarea>

        <input id="customerCity" placeholder="City">

        <input id="customerState" placeholder="State">

        <input id="customerPincode" placeholder="Pincode">

    </div>

    <div class="summary-box">

        <h2>Order Summary</h2>

        <div id="orderItems"></div>

        <hr>

        <h3 id="orderTotal"></h3>

        <button onclick="placeOrder()">

            Place Order

        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://bojfqifnbwhavmcrxmkg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3AIqLVymxDF06OsewH_Byg_V_YZ0atI";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let cart =
JSON.parse(
    localStorage.getItem("cart")
) || [];

let total = 0;

const orderItemsDiv =
document.getElementById("orderItems");

orderItemsDiv.innerHTML = "";

cart.forEach(item=>{

const lineTotal =
Number(item.price) *
Number(item.quantity);

total += lineTotal;

orderItemsDiv.innerHTML += `

<div class="order-item">

<div>

<b>${item.name}</b>

<br>

Qty : ${item.quantity}

</div>


<div>

₹${lineTotal}

</div>

</div>

`;

});

document.getElementById(
"orderTotal"
).innerHTML =

`Total : ₹${total}`;

async function placeOrder(){

    const userId =
    localStorage.getItem("userId");

    if(!userId){

        alert("Please Login First");
        return;
    }

    const customerName =
    document.getElementById(
        "customerName"
    ).value;

    const customerPhone =
    document.getElementById(
        "customerPhone"
    ).value;

    const customerAddress =
    document.getElementById(
        "customerAddress"
    ).value;

    const customerCity =
    document.getElementById(
    "customerCity"
    ).value;

    const customerState =
    document.getElementById(
    "customerState"
    ).value;

    const customerPincode =
    document.getElementById(
    "customerPincode"
    ).value;

    if(

    !customerName ||

    !customerPhone ||

    !customerAddress ||

    !customerCity ||

    !customerState ||

    !customerPincode

    ){

    alert(

    "Please fill all shipping details."

    );

    return;

    }

    const orderNumber =
    "ORD-" + Date.now();

    localStorage.setItem(
    "lastOrderNumber",
    orderNumber
    );

    const {
        data: orderData,
        error: orderError
    } =
    await supabaseClient
    .from("orders")
    .insert([
        {
            user_id: userId,
            order_number: orderNumber,
            status: "pending",

            subtotal: total,
            discount_amount: 0,
            shipping_charge: 0,
            tax_amount: 0,
            total_amount: total,

            shipping_name: customerName,
            shipping_phone: customerPhone,
            shipping_address: customerAddress,

            shipping_city: customerCity,

            shipping_state: customerState,

            shipping_pincode: customerPincode,
            
            shipping_country: "India"
        }
    ])
    .select()
    .single();

    if(orderError){

        console.error(orderError);
        alert(orderError.message);
        return;
    }

    for(const item of cart){

        const { data, error } =
        await supabaseClient
        .from("order_items")
        .insert([
            {
                order_id: orderData.id,

                product_id: item.id,

                product_name: item.name,

                product_sku: item.sku || "SKU-001",

                quantity: item.quantity || 1,

                unit_price: Number(item.price),

                discount_price: Number(item.price),

                line_total:
                Number(item.price) *
                (item.quantity || 1)
            }
        ]);

        if(error){

        console.error(error);

        alert(
        "Failed to save order items."
        );

        return;

}

        const {
    data: productData,
    error: stockError
}
=
await supabaseClient
.from("products")
.select("stock_qty")
.eq("id", item.id)
.single();

if(!stockError && productData){

    if(productData.stock_qty < item.quantity){

alert(

item.name +

" is out of stock."

);

return;

}

const newStock =
productData.stock_qty -
item.quantity;

    const {

error:updateError

}

=

await supabaseClient

.from("products")

.update({

stock_qty:newStock

})

.eq("id",item.id);

if(updateError){

console.error(updateError);

alert(

"Failed to update product stock."

);

return;

}

}
    }

    localStorage.removeItem(
        "cart"
    );

    window.location.href =
    "order-success.html";
}

</script>

</body>
</html>
