<!DOCTYPE html>
<html>
<head>

    <title>Order Success</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.success-card{

width:520px;

background:white;

padding:45px;

border-radius:22px;

text-align:center;

box-shadow:
0 20px 45px rgba(0,0,0,.08);

}

.success-icon{

font-size:90px;

margin-bottom:15px;

}

h1{

margin:0;

font-size:36px;

color:#111633;

}

.success-text{

margin-top:15px;

font-size:17px;

color:#666;

line-height:28px;

}

.info-box{

margin:35px 0;

padding:20px;

background:#f8fafc;

border-radius:15px;

text-align:left;

}

.info-row{

display:flex;

justify-content:space-between;

padding:10px 0;

border-bottom:1px solid #ececec;

}

.info-row:last-child{

border:none;

}

.label{

color:#666;

font-weight:bold;

}

.value{

color:#111633;

font-weight:bold;

}

.btn{

display:block;

width:100%;

padding:15px;

margin-top:15px;

border-radius:12px;

text-decoration:none;

font-weight:bold;

transition:.3s;

}

.shop-btn{

background:#ff5a2c;

color:white;

}

.shop-btn:hover{

background:#ea4b1c;

}

.orders-btn{

background:#111633;

color:white;

}

.orders-btn:hover{

background:#222b56;

}

</style>

</head>

<body>

    <div class="success-card">

<div class="success-icon">

✅

</div>

<h1>

Order Placed Successfully!

</h1>

<p class="success-text">

Thank you for shopping with
<b>LaLa's Mart</b>.

Your order has been received successfully.

</p>

<div class="info-box">

<div class="info-row">

<span class="label">

Order Number

</span>

<span
class="value"
id="orderNumber"
>

Loading...

</span>

</div>

<div class="info-row">

<span class="label">

Estimated Delivery

</span>

<span class="value">

As Soon As Possible Tonight

</span>

</div>

</div>

<a
href="index.html"
class="btn shop-btn"
>

Continue Shopping

</a>

<a
href="my-orders.html"
class="btn orders-btn"
>

My Orders

</a>

</div>

<script>

const orderNumber =

localStorage.getItem(
"lastOrderNumber"
);

document.getElementById(
"orderNumber"
).innerText =

orderNumber || "N/A";

</script>

</body>
</html>
