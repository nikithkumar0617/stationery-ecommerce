<!DOCTYPE html>
<html>
<head>
    <title>My Orders - LaLa's Mart</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <style>

.page-title{

    margin-bottom:40px;

}

.page-title h1{

    margin:0;

    font-size:58px;

    font-weight:800;

    color:#111633;

    line-height:1.1;

}

.title-line{

    width:90px;

    height:5px;

    background:#ff5a2c;

    border-radius:10px;

    margin-top:14px;

}

body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f7fb;

padding:40px;

color:#111633;

}

.container{

max-width:1100px;

margin:auto;

}

.page-title{

font-size:42px;

margin-bottom:35px;

}

.order-card{

background:white;

padding:28px;

border-radius:20px;

box-shadow:0 12px 30px rgba(0,0,0,.08);

margin-bottom:25px;

transition: all 0.3s ease;

cursor: pointer;

}

.order-card:hover{

transform:translateY(-6px);
box-shadow: 0 16px 40px rgba(0,0,0,0.12);
border: 1px solid #ffe0cc;

}

.order-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.order-number{

font-size:24px;

font-weight:bold;

}

.order-date{

color:#777;

margin-top:5px;

}

.status{

padding:8px 16px;

border-radius:30px;

font-weight:bold;

color:white;

font-size:14px;

text-transform:capitalize;

}

.products{

margin:20px 0;

padding:15px;

background:#f8fafc;

border-radius:12px;

}

.products li{

margin:8px 0;

}

.total{

font-size:24px;

font-weight:bold;

color:#ff5a2c;

margin-top:20px;

}

.track-btn{

display:inline-block;

margin-top:20px;

padding:12px 20px;

background:#111633;

color:white;

text-decoration:none;

border-radius:10px;

font-weight:bold;

transition:.3s;

}

.track-btn:hover{

background:#1e2858;

}

.page-header{
    margin-bottom:40px;
}

.page-header h1{
    margin:0;

    font-size:58px;

    font-weight:800;

    color:#111633;

    line-height:1.1;
}

.underline{
    width:90px;
    height:5px;
    background:#ff5a2c;
    border-radius:10px;
    margin-top:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="page-title">

<h1>My Orders</h1>

<div class="underline"></div>

</div>

<div id="ordersContainer">

Loading Orders...

</div>

<script>

const supabaseClient =
supabase.createClient(
    "https://bojfqifnbwhavmcrxmkg.supabase.co",
    "sb_publishable_3AIqLVymxDF06OsewH_Byg_V_YZ0atI"
);

loadOrders();

function getStatusColor(status){

    switch(status?.toLowerCase()){

        case "pending":
            return "#f39c12";

        case "confirmed":
            return "#3498db";

        case "shipped":
            return "#9b59b6";

        case "delivered":
            return "#27ae60";

        case "cancelled":
            return "#e74c3c";

        default:
            return "#666";
    }

}

async function loadOrders(){

    const userId =
    localStorage.getItem("userId");

    const {
        data: orders,
        error
    } =
    await supabaseClient
    .from("orders")
    .select("*")
    .eq("user_id", userId)
    .order("placed_at", {
        ascending:false
    });

    const container =
    document.getElementById(
        "ordersContainer"
    );

    if(!orders || orders.length===0){

        container.innerHTML =
        "<h3>No Orders Found</h3>";

        return;
    }

    container.innerHTML = "";

    for(const order of orders){
        const {
            data: items
        } =
        await supabaseClient
        .from("order_items")
        .select("*")
        .eq("order_id", order.id);
        
        let productsHtml = "";
        
        items.forEach(item=>{
            
productsHtml += `

<li
style="
margin-bottom:15px;
list-style:none;
"
>

<div>

✅ <b>${item.product_name}</b>

</div>

<div
style="
margin-left:24px;
color:#666;
"
>

Quantity :
${item.quantity}

</div>

</li>

`;
        });

        if(productsHtml === ""){
            
            productsHtml =
            "<li>No products recorded</li>";

        }

container.innerHTML += `

<div class="order-card">

<div class="order-header">

<div>

<div
style="
font-size:14px;
color:#777;
margin-bottom:5px;
"
>

Order Number

</div>

<div class="order-number">

${order.order_number}

</div>

<div
class="order-date"
style="
margin-top:8px;
"
>

${new Date(order.placed_at).toLocaleString()}

</div>

</div>

<div
style="
text-align:right;
"
>

<div
class="status"
style="background:${getStatusColor(order.status)};"
>

${order.status}

</div>

<div


style="
margin-top:10px;
font-size:13px;
color:#666;
"
>
<h3>
Estimated Delivery
</h3>

<br>

As Soon As Possible Tonight.

</div>

</div>

</div>

<div class="products">

<h4>

Products

</h4>

<ul>

${productsHtml}

</ul>

</div>

<div
style="
margin-top:20px;
padding:18px;
background:#f8fafc;
border-radius:12px;
"
>

<h4
style="
margin-top:0;
"
>

📍 Shipping Address

</h4>

<div>

<b>${order.shipping_name}</b>

</div>

<div>

${order.shipping_phone}

</div>

<div>

${order.shipping_address}

</div>

<div>

${order.shipping_city},
${order.shipping_state}

</div>

<div>

${order.shipping_pincode}

</div>

<div>

India

</div>

</div>

<div
style="
margin-top:20px;
"
>

<div
style="
font-size:14px;
color:#777;
"
>

Total Amount

</div>

<div class="total">

₹${order.total_amount}

</div>

</div>

<a

href="track-order.html?id=${order.id}"

class="track-btn"

>

Track Order

</a>

</div>

`;

    }

}

</script>

</body>
</html>
