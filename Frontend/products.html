<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Products - LaLa's Mart</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="products-page">

    <div class="products-header">

        <h1>All Products</h1>

        <p>
            Discover our complete stationery collection
        </p>

    </div>

    <div class="products-toolbar">

        <input
            type="text"
            id="searchBox"
            placeholder="Search products..."
        >

        <select id="categoryFilter">

            <option value="">
                All Categories
            </option>

        </select>

        <select id="sortFilter">

            <option value="">
                Sort By
            </option>

            <option value="low">
                Price : Low to High
            </option>

            <option value="high">
                Price : High to Low
            </option>

            <option value="name">
                Name A-Z
            </option>

        </select>

    </div>

    <div
        class="row"
        id="products-container"
    >
    </div>

</div>

<script src="script.js"></script>

</body>

</html>
