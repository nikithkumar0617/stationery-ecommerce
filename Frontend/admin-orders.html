<!DOCTYPE html>
<html>
<head>
<title>Admin Orders</title>

<style>

.order-items{
    margin-top:15px;
    margin-bottom:15px;
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
}

.order-items h4{
    margin:0 0 10px;
    color:#111633;
}

.order-items p{
    margin:5px 0;
    color:#555;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2ff;
}

.header{
    background:linear-gradient(
        135deg,
        #111633,
        #080269
    );
    color:white;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:#ff5a2c;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.page-title{
    margin-bottom:25px;
}

.order-card{
    background:white;
    border-radius:16px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    border-left:6px solid #ff5a2c;
    transition:.3s;
}

.order-card:hover{
    transform:translateY(-3px);
}

.order-number{
    color:#111633;
    margin-bottom:15px;
}

.order-info{
    line-height:1.8;
    color:#555;
}

.order-total{
    font-size:22px;
    font-weight:bold;
    color:#ff5a2c;
    margin:15px 0;
}

.status-select{
    padding:10px 18px;
    border:none;
    outline:none;
    border-radius:30px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
    min-width:140px;
    transition:.3s;
}

.pending-status{
    background:#fff3cd;
    color:#856404;
}

.confirmed-status{
    background:#d4edda;
    color:#155724;
}

.shipped-status{
    background:#cfe2ff;
    color:#084298;
}

.delivered-status{
    background:#d1e7dd;
    color:#0f5132;
}

.cancelled-status{
    background:#f8d7da;
    color:#842029;
}

</style>

</head>

<body>

<h1>Admin Orders Dashboard</h1>

<div class="header">

    <div class="logo">
        LaLa's<span>Mart</span>
    </div>

    <div class="nav-links">

        <a href="admin-dashboard.html">
            Dashboard
        </a>

        <a href="admin-products.html">
            Products
        </a>

        <a href="admin-orders.html">
            Orders
        </a>

    </div>

</div>

<div class="container">

    <h1 class="page-title">
        Orders Management
    </h1>

<div style="
margin-bottom:20px;
">

<input
id="searchOrders"
type="text"
placeholder="Search by Order Number or Customer Name..."
style="
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
"
/>

</div>

    <div id="ordersContainer">
        Loading Orders...
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

    let allOrders = [];

const supabaseClient =
supabase.createClient(
"https://bojfqifnbwhavmcrxmkg.supabase.co",
"sb_publishable_3AIqLVymxDF06OsewH_Byg_V_YZ0atI"
);

loadOrders();

document
.getElementById("searchOrders")
.addEventListener(
    "input",
    filterOrders
);

async function updateStatus(
    orderId,
    newStatus,
    selectElement
){

    const {
        error
    } = await supabaseClient
    .from("orders")
    .update({
        status: newStatus
    })
    .eq(
        "id",
        orderId
    );

    if(error){

        alert(
            error.message
        );

        return;
    }

    console.log(
        "Status Updated"
    );

    selectElement.className =
    "status-select " +
    newStatus +
    "-status";

    loadOrders();

    

}

function filterOrders(){

    const searchText =
    document
    .getElementById("searchOrders")
    .value
    .toLowerCase();

    const filteredOrders =
    allOrders.filter(order =>

        order.order_number
        .toLowerCase()
        .includes(searchText)

        ||

        order.shipping_name
        .toLowerCase()
        .includes(searchText)

    );

    renderOrders(filteredOrders);

}

async function loadOrders(){

    const {
        data: orders,
        error
    }
    =
    await supabaseClient
    .from("orders")
    .select(`
        *,
        order_items (
            product_name,
            quantity,
            line_total
        )
    `)
    .order(
        "placed_at",
        {
            ascending:false
        }
    );

    if(error){

        console.error(error);
    
        return;
    }

    allOrders = orders;

    renderOrders(orders);

}

function renderOrders(orders){

    const container =
    document.getElementById(
        "ordersContainer"
    );

    container.innerHTML = "";

    orders.forEach(order => {

        let statusClass = "";

        if(order.status === "pending"){
            statusClass = "pending-status";
        }
        else if(order.status === "confirmed"){
            statusClass = "confirmed-status";
        }
        else if(order.status === "shipped"){
            statusClass = "shipped-status";
        }
        else if(order.status === "delivered"){
            statusClass = "delivered-status";
        }
        else if(order.status === "cancelled"){
            statusClass = "cancelled-status";
        }

        container.innerHTML += `

        <div class="order-card">

            <h2 class="order-number">
                ${order.order_number}
            </h2>

            <div class="order-info">

                <strong>Customer:</strong>
                ${order.shipping_name}
                <br>

                <strong>Phone:</strong>
                ${order.shipping_phone}
                <br>

                <strong>Address:</strong>
                ${order.shipping_address}

            </div>

            <div class="order-total">
                ₹${order.total_amount}
            </div>

            <div class="order-items">

                <h4>Items Ordered</h4>

                ${
                order.order_items
                .map(item => `
                <p>
                • ${item.product_name}
                (x${item.quantity})
                </p>
                `)
                .join("")
                }

            </div>

            <label>
                <strong>Status:</strong>
            </label>

            <br><br>

            <select
            class="status-select ${statusClass}"
            onchange="
            updateStatus(
            '${order.id}',
            this.value,
            this
            )">

                <option
                value='pending'
                ${order.status === 'pending' ? 'selected' : ''}
                >
                Pending
                </option>

                <option
                value='confirmed'
                ${order.status === 'confirmed' ? 'selected' : ''}
                >
                Confirmed
                </option>

                <option
                value='shipped'
                ${order.status === 'shipped' ? 'selected' : ''}
                >
                Shipped
                </option>

                <option
                value='delivered'
                ${order.status === 'delivered' ? 'selected' : ''}
                >
                Delivered
                </option>

                <option
                value='cancelled'
                ${order.status === 'cancelled' ? 'selected' : ''}
                >
                Cancelled
                </option>

            </select>

        </div>

        `;

    });

}

</script>

</body>
</html>
